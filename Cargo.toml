[package]
name = "rnn"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
clap = { version = "4.5.36", features = ["derive"] }
csv = "1.3.1"
faer = "0.22.6"
faer-ext = { version = "0.6.0", features = ["polars"] }
ndarray = { version = "0.16.1", features = ["rayon", "blas"] }
ndarray-linalg = { version = "0.17.0", features = ["openblas-system"] }
ndarray-parallel = "0.9.1"
ndarray-rand = "0.15.0"
ndarray-stats = "0.6.0"
num_cpus = "1.17.0"
plotters = { version = "0.3.7" }
polars = { version = "0.46.0", features = ["lazy", "ndarray"] }
criterion = { version = "0.5", optional = true }
polars-core = { version = "0.46.0", features = ["ndarray"] }
rand = "0.9.0"
rayon = "1.10.0"
wide = "0.7.32"
# openblas-src = { version = "0.10", features = ["cblas", "system"], optional = true }
# netlib-src = { version = "0.8", features = ["cblas", "system"], optional = true }
# intel-mkl-src = { version = "0.8", features = ["mkl-static-lp64-iomp"], optional = true }
anyhow = "1.0.98"
thiserror = "2.0.12"
# ndarray-linalg = { version = "0.17.0", features = ["openblas"] }


[dev-dependencies]
approx = "0.5"
proptest = "1.5"

